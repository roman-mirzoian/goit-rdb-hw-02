<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">ER-діаграма: облік замовлень (3НФ)</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#1f2937">
    <!-- customers -->
    <rect x="40" y="80" width="300" height="126" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M40 116 V86 a6 6 0 0 1 6 -6 H334 a6 6 0 0 1 6 6 V116 Z" fill="#1e3a8a"/>
    <text x="190" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">customers</text>
    <rect x="41" y="116" width="298" height="30" fill="#fef3c7"/>
    <text x="50" y="136" font-weight="bold" fill="#92400e">PK</text><text x="86" y="136" font-weight="bold">customer_id</text><text x="206" y="136" fill="#6b7280">INT UNSIGNED</text>
    <line x1="40" y1="146" x2="340" y2="146" stroke="#e5e7eb"/>
    <text x="86" y="166">customer_name</text><text x="206" y="166" fill="#6b7280">VARCHAR(100)</text>
    <line x1="40" y1="176" x2="340" y2="176" stroke="#e5e7eb"/>
    <text x="86" y="196">address</text><text x="206" y="196" fill="#6b7280">VARCHAR(255)</text>

    <!-- orders -->
    <rect x="560" y="80" width="300" height="126" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M560 116 V86 a6 6 0 0 1 6 -6 H854 a6 6 0 0 1 6 6 V116 Z" fill="#1e3a8a"/>
    <text x="710" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">orders</text>
    <rect x="561" y="116" width="298" height="30" fill="#fef3c7"/>
    <text x="570" y="136" font-weight="bold" fill="#92400e">PK</text><text x="606" y="136" font-weight="bold">order_id</text><text x="726" y="136" fill="#6b7280">INT UNSIGNED</text>
    <line x1="560" y1="146" x2="860" y2="146" stroke="#e5e7eb"/>
    <text x="606" y="166">order_date</text><text x="726" y="166" fill="#6b7280">DATE</text>
    <line x1="560" y1="176" x2="860" y2="176" stroke="#e5e7eb"/>
    <rect x="561" y="176" width="298" height="29" fill="#dcfce7"/>
    <text x="570" y="196" font-weight="bold" fill="#166534">FK</text><text x="606" y="196">customer_id</text><text x="726" y="196" fill="#6b7280">INT UNSIGNED</text>

    <!-- products -->
    <rect x="40" y="380" width="300" height="96" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M40 416 V386 a6 6 0 0 1 6 -6 H334 a6 6 0 0 1 6 6 V416 Z" fill="#1e3a8a"/>
    <text x="190" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">products</text>
    <rect x="41" y="416" width="298" height="30" fill="#fef3c7"/>
    <text x="50" y="436" font-weight="bold" fill="#92400e">PK</text><text x="86" y="436" font-weight="bold">product_id</text><text x="206" y="436" fill="#6b7280">INT UNSIGNED</text>
    <line x1="40" y1="446" x2="340" y2="446" stroke="#e5e7eb"/>
    <text x="50" y="466" font-weight="bold" fill="#6d28d9">UQ</text><text x="86" y="466">product_name</text><text x="206" y="466" fill="#6b7280">VARCHAR(100)</text>

    <!-- order_items -->
    <rect x="560" y="380" width="300" height="126" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M560 416 V386 a6 6 0 0 1 6 -6 H854 a6 6 0 0 1 6 6 V416 Z" fill="#1e3a8a"/>
    <text x="710" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">order_items</text>
    <rect x="561" y="416" width="298" height="60" fill="#fef3c7"/>
    <text x="568" y="436" font-weight="bold" fill="#92400e">PK,FK</text><text x="616" y="436" font-weight="bold">order_id</text><text x="736" y="436" fill="#6b7280">INT UNSIGNED</text>
    <line x1="560" y1="446" x2="860" y2="446" stroke="#e5e7eb"/>
    <text x="568" y="466" font-weight="bold" fill="#92400e">PK,FK</text><text x="616" y="466" font-weight="bold">product_id</text><text x="736" y="466" fill="#6b7280">INT UNSIGNED</text>
    <line x1="560" y1="476" x2="860" y2="476" stroke="#e5e7eb"/>
    <text x="616" y="496">quantity</text><text x="736" y="496" fill="#6b7280">INT UNSIGNED</text>
  </g>

  <g stroke="#374151" stroke-width="1.6" fill="none">
    <!-- customers 1 —— 0..N orders -->
    <line x1="340" y1="143" x2="560" y2="143"/>
    <line x1="352" y1="135" x2="352" y2="151"/><line x1="360" y1="135" x2="360" y2="151"/>
    <circle cx="532" cy="143" r="6" fill="#ffffff"/>
    <line x1="544" y1="143" x2="560" y2="135"/><line x1="544" y1="143" x2="560" y2="151"/>

    <!-- orders 1 —— 1..N order_items -->
    <line x1="710" y1="206" x2="710" y2="380"/>
    <line x1="702" y1="218" x2="718" y2="218"/><line x1="702" y1="226" x2="718" y2="226"/>
    <line x1="702" y1="356" x2="718" y2="356"/>
    <line x1="710" y1="364" x2="702" y2="380"/><line x1="710" y1="364" x2="718" y2="380"/>

    <!-- products 1 —— 0..N order_items -->
    <line x1="340" y1="428" x2="560" y2="428"/>
    <line x1="352" y1="420" x2="352" y2="436"/><line x1="360" y1="420" x2="360" y2="436"/>
    <circle cx="532" cy="428" r="6" fill="#ffffff"/>
    <line x1="544" y1="428" x2="560" y2="420"/><line x1="544" y1="428" x2="560" y2="436"/>
  </g>

  <g font-size="13" fill="#1f2937">
    <text x="450" y="132" text-anchor="middle" font-style="italic">places</text>
    <text x="450" y="164" text-anchor="middle" font-weight="bold" fill="#1e3a8a">1 : N</text>
    <text x="368" y="164" fill="#6b7280">1</text><text x="508" y="164" fill="#6b7280" text-anchor="end">0..N</text>

    <text x="726" y="290" font-style="italic">contains</text>
    <text x="726" y="308" font-weight="bold" fill="#1e3a8a">1 : N</text>
    <text x="690" y="240" fill="#6b7280" text-anchor="end">1</text><text x="690" y="352" fill="#6b7280" text-anchor="end">1..N</text>

    <text x="450" y="417" text-anchor="middle" font-style="italic">is ordered in</text>
    <text x="450" y="449" text-anchor="middle" font-weight="bold" fill="#1e3a8a">1 : N</text>
    <text x="368" y="449" fill="#6b7280">1</text><text x="508" y="449" fill="#6b7280" text-anchor="end">0..N</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#374151">
    <line x1="40" y1="540" x2="860" y2="540" stroke="#e5e7eb"/>
    <g stroke="#374151" stroke-width="1.6" fill="none">
      <line x1="40" y1="566" x2="80" y2="566"/><line x1="52" y1="558" x2="52" y2="574"/><line x1="60" y1="558" x2="60" y2="574"/>
      <line x1="300" y1="566" x2="340" y2="566"/><circle cx="312" cy="566" r="6" fill="#ffffff"/><line x1="324" y1="566" x2="340" y2="558"/><line x1="324" y1="566" x2="340" y2="574"/>
      <line x1="580" y1="566" x2="620" y2="566"/><line x1="596" y1="558" x2="596" y2="574"/><line x1="604" y1="566" x2="620" y2="558"/><line x1="604" y1="566" x2="620" y2="574"/>
    </g>
    <text x="90" y="571">рівно один (1)</text>
    <text x="350" y="571">нуль або багато (0..N)</text>
    <text x="630" y="571">один або багато (1..N)</text>
    <text x="40" y="604">Усі колонки NOT NULL. orders ↔ products — зв'язок N : M, реалізований через асоціативну таблицю order_items.</text>
    <text x="40" y="624">PK — первинний ключ, FK — зовнішній ключ, UQ — унікальне значення.</text>
  </g>
</svg>
