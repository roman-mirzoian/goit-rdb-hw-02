<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Arial, sans-serif" font-size="13">
  <rect width="760" height="440" fill="#ffffff"/>

  <g fill="#000000">
    <!-- customers -->
    <rect x="20" y="20" width="260" height="104" fill="#ffffff" stroke="#888888"/>
    <rect x="20" y="20" width="260" height="26" fill="#dddddd" stroke="#888888"/>
    <text x="30" y="38" font-weight="bold">customers</text>
    <text x="30" y="66">customer_id</text><text x="150" y="66" fill="#555555">INT UNSIGNED</text><text x="270" y="66" text-anchor="end" font-weight="bold">PK</text>
    <text x="30" y="90">customer_name</text><text x="150" y="90" fill="#555555">VARCHAR(100)</text>
    <text x="30" y="114">address</text><text x="150" y="114" fill="#555555">VARCHAR(255)</text>

    <!-- orders -->
    <rect x="480" y="20" width="260" height="104" fill="#ffffff" stroke="#888888"/>
    <rect x="480" y="20" width="260" height="26" fill="#dddddd" stroke="#888888"/>
    <text x="490" y="38" font-weight="bold">orders</text>
    <text x="490" y="66">order_id</text><text x="610" y="66" fill="#555555">INT UNSIGNED</text><text x="730" y="66" text-anchor="end" font-weight="bold">PK</text>
    <text x="490" y="90">order_date</text><text x="610" y="90" fill="#555555">DATE</text>
    <text x="490" y="114">customer_id</text><text x="610" y="114" fill="#555555">INT UNSIGNED</text><text x="730" y="114" text-anchor="end" font-weight="bold">FK</text>

    <!-- products -->
    <rect x="20" y="300" width="260" height="80" fill="#ffffff" stroke="#888888"/>
    <rect x="20" y="300" width="260" height="26" fill="#dddddd" stroke="#888888"/>
    <text x="30" y="318" font-weight="bold">products</text>
    <text x="30" y="346">product_id</text><text x="150" y="346" fill="#555555">INT UNSIGNED</text><text x="270" y="346" text-anchor="end" font-weight="bold">PK</text>
    <text x="30" y="370">product_name</text><text x="150" y="370" fill="#555555">VARCHAR(100)</text>

    <!-- order_items -->
    <rect x="480" y="300" width="260" height="104" fill="#ffffff" stroke="#888888"/>
    <rect x="480" y="300" width="260" height="26" fill="#dddddd" stroke="#888888"/>
    <text x="490" y="318" font-weight="bold">order_items</text>
    <text x="490" y="346">order_id</text><text x="580" y="346" fill="#555555">INT UNSIGNED</text><text x="730" y="346" text-anchor="end" font-weight="bold">PK, FK</text>
    <text x="490" y="370">product_id</text><text x="580" y="370" fill="#555555">INT UNSIGNED</text><text x="730" y="370" text-anchor="end" font-weight="bold">PK, FK</text>
    <text x="490" y="394">quantity</text><text x="580" y="394" fill="#555555">INT UNSIGNED</text>
  </g>

  <g stroke="#333333" stroke-width="1.4" fill="none">
    <!-- customers 1 - N orders -->
    <line x1="280" y1="62" x2="480" y2="62"/>
    <line x1="290" y1="55" x2="290" y2="69"/><line x1="297" y1="55" x2="297" y2="69"/>
    <line x1="466" y1="62" x2="480" y2="55"/><line x1="466" y1="62" x2="480" y2="69"/>

    <!-- orders 1 - N order_items -->
    <line x1="610" y1="124" x2="610" y2="300"/>
    <line x1="603" y1="134" x2="617" y2="134"/><line x1="603" y1="141" x2="617" y2="141"/>
    <line x1="610" y1="286" x2="603" y2="300"/><line x1="610" y1="286" x2="617" y2="300"/>

    <!-- products 1 - N order_items -->
    <line x1="280" y1="342" x2="480" y2="342"/>
    <line x1="290" y1="335" x2="290" y2="349"/><line x1="297" y1="335" x2="297" y2="349"/>
    <line x1="466" y1="342" x2="480" y2="335"/><line x1="466" y1="342" x2="480" y2="349"/>
  </g>

  <g fill="#333333">
    <text x="304" y="55">1</text><text x="458" y="55" text-anchor="end">N</text>
    <text x="620" y="152">1</text><text x="620" y="284">N</text>
    <text x="304" y="335">1</text><text x="458" y="335" text-anchor="end">N</text>
  </g>
</svg>
